<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The main angular drop shape (Left Side: Solid Red) -->
  <path d="M 50 5 L 85 60 L 50 95 L 15 60 Z" fill="#c0392b" />
  <!-- Dark Accent Scan Lines on the right half -->
  <clipPath id="dropHalf">
    <path d="M 50 5 L 85 60 L 50 95 Z" />
  </clipPath>
  <g clip-path="url(#dropHalf)">
    <rect x="50" y="0" width="50" height="100" fill="#1a1a1a" />
    <!-- Thick scan lines in Brand Red -->
    <rect x="50" y="20" width="50" height="6" fill="#c0392b" />
    <rect x="50" y="35" width="50" height="6" fill="#c0392b" />
    <rect x="50" y="50" width="50" height="6" fill="#c0392b" />
    <rect x="50" y="65" width="50" height="6" fill="#c0392b" />
    <rect x="50" y="80" width="50" height="6" fill="#c0392b" />
  </g>
</svg>
